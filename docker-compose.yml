services:
  # Production — built image, port 3000
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # Development — hot reload, mount source
  web-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    profiles:
      - dev

volumes:
  node_modules:
  next_cache:
